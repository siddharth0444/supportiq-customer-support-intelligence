[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportiq"
version = "0.1.0"
description = "Customer-support intelligence using NLP baselines and FastAPI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["supportiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
